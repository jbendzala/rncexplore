name: Aktualizácia kurzov

# Raz týždenne skontroluje kurz ECB. Zapíše ho len vtedy, keď sa od toho
# v config.js líši o viac než prah v tools/update_rates.py — inak neurobí
# nič, aby ceny neposkakovali a nepribúdali zbytočné commity.
on:
  schedule:
    - cron: "0 6 * * 1"        # každý pondelok o 06:00 UTC
  workflow_dispatch:            # dá sa spustiť aj ručne z karty Actions

permissions:
  contents: write

jobs:
  kurzy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Načítať kurz ECB a prepísať config.js
        run: python3 tools/update_rates.py

      - name: Commitnúť, ak sa kurz zmenil
        run: |
          if git diff --quiet -- config.js; then
            echo "Kurzy sa nezmenili, nie je čo commitnúť."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js
          git commit -m "Kurzy podľa ECB $(date -u +%d.%m.%Y)"
          git push
